# docker-compose.prod.yml
# Configuración para PRODUCCIÓN
# Uso: docker compose -f docker-compose.prod.yml up -d

services:
  api:
    build: .
    container_name: api-realsolve
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - realsolve-network

  db:
    image: postgres:16
    container_name: postgres-realsolve
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      POSTGRES_DB: ${POSTGRES_DB:-realsolveai}
    volumes:
      # Volumen nombrado de Docker (mejor para producción)
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - realsolve-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-realsolveai}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  realsolve-network:
    driver: bridge

volumes:
  # Volumen nombrado - Docker lo gestiona automáticamente
  postgres_data:
    driver: local
